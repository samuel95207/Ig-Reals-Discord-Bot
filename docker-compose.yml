services:
  ig-reels-bot:
    build: .
    image: ig-reels-discord-bot:latest
    container_name: ig-reels-discord-bot
    restart: unless-stopped
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ig_cookies:/app/cookies
      - ig_data:/app/data

volumes:
  ig_cookies:
  ig_data:
