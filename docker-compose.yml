services:
  ig-reels-bot:
    build: .
    image: ig-reels-discord-bot:latest
    # The image is built from source, not pulled from a registry; without this,
    # Portainer's auto-update redeploy fails trying to pull it
    pull_policy: build
    container_name: ig-reels-discord-bot
    restart: unless-stopped
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      # Comma-separated list of keys, tried in order when quota runs out;
      # GEMINI_API_KEY still works as a single-key fallback
      - GEMINI_API_KEYS=${GEMINI_API_KEYS}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ig_cookies:/app/cookies
      - ig_data:/app/data

volumes:
  ig_cookies:
  ig_data:
